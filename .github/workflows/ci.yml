name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs the `prepare` script, which builds dist/.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The package as npm would ship it: valid exports, and types that resolve
      # for both `import` and `require`.
      - run: npm run check:package
